about_content: | # this will include new lines to allow paragraphs
 I am a research engineer at CEA Saclay since June 2024. I have a DEng in Mechanical Engineering (2019) with a focus on materials science from [Unicamp](https://www.unicamp.br/en/).
 
 My thesis focused on alloy design for aeronautical and biomedical applications. Furthermore, I have been working with multiscale simulations since 2020, mostly at the intersection of ab-initio, machine learning, and materials characterization.
 
 Relevant topics include:
 - Deep learning for materials characterization
 - High-throughput experiments (in-situ transmission electron microscopy, synchrotron)
 - Materials under extreme conditions (irradiation, high pressure/temperature)
 - Ab-initio calculations
 - Local atomic environment analysis
 - Digital twins for materials design
 
 For more info, please refer to my CV ([pdf](./files/cv.pdf)).
 
